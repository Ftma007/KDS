name: Build Android app

# Packages the KDS screens in this repository as the Android app.
# It does not change any screen code. Run it from the Actions tab (Run workflow),
# and it also runs on every push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install the screens' dependencies
        run: npm ci || npm install

      - name: Build the screens
        env:
          # The Android app is the live system: it talks to the server.
          # (The web version on Vercel has no server address, so it stays the demo.)
          VITE_API_URL: https://sufra-kds-backend.onrender.com/api
        run: npm run build

      - name: Add the Android tools for this build only (package.json is not changed)
        run: npm install --no-save @capacitor/core@6.2.3 @capacitor/android@6.2.3 @capacitor/cli@6.2.3

      - name: Copy the built screens into the Android project
        run: npx cap sync android

      - name: Prepare the signing key from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "The ANDROID_KEYSTORE_BASE64 secret is missing. See ANDROID.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the signed app
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PappVersionCode=${{ github.run_number }} -PappVersionName=1.0.${{ github.run_number }}

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: sufra-kds-android-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
